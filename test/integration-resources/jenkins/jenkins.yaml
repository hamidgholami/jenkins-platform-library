jenkins:
  systemMessage: "Disposable library integration controller"
  numExecutors: 0
  scmCheckoutRetryCount: 0
  mode: EXCLUSIVE
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "test-admin"
          password: "${TEST_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: "integration-agent"
        labelString: "integration"
        remoteFS: "/tmp/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        launcher:
          inbound:
            webSocket: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "fixture-git"
              username: "reader"
              password: "${TEST_GIT_PASSWORD}"
          - usernamePassword:
              scope: GLOBAL
              id: "fixture-invalid"
              username: "reader"
              password: "${TEST_INVALID_PASSWORD}"
unclassified:
  globalUntrustedLibraries:
    libraries:
      - name: "jenkins-platform-library"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "http://git:8081/library.git"
                credentialsId: "fixture-git"
                traits:
                  - gitBranchDiscovery
                  - cloneOptionTrait:
                      extension:
                        shallow: false
                        noTags: false
                        reference: ""
                        timeout: 5
                        honorRefspec: true
  location:
    url: "http://controller:8080/"
